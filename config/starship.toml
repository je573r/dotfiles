# Don't print a new line at the start of the prompt
add_newline = true
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """
$directory $git_branch $git_status
$character"""
# format = """
# $cmd_duration $directory$git_branch
#  $character"""

[fill]
symbol = '-'
style = 'fg:245'

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"                            # The name of the module we are configuring is "character"
# success_symbol = "[ ](bold fg:243)"
# error_symbol = "[ ](bold fg:244)"
vicmd_symbol = "[❮](bold yellow)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bold purple"
symbol = "󰘬"
truncation_length = 3
truncation_symbol = ""
format = "[$symbol$branch]($style) "
# format = " 󰜥 [](bold fg:252)[$symbol $branch(:$remote_branch)](fg:235 bg:252)[ ](bold fg:252)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
style="bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:252 fg:235"
style_root = "red bold"
format = "[](bold fg:252)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bold cyan"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = false
format = '[╰─ ](bold red)[$path](bold red)'
#format = '[](bold fg:255)[󰉋 → $path]($style)[](bold fg:255)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow)"
# format = '[](bold fg:252)[󰪢 $duration](bold bg:252 fg:235)[](bold fg:252)'
